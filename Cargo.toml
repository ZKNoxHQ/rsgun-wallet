[workspace]
members = [
    "crates/waku-light",
    "crates/railgun-broadcaster",
    "crates/kv-store-js",
    "crates/railgun-chains",
    "crates/railgun-ledger",
    "crates/railgun-wallet",
    "crates/railgun-wallet-web",
    "crates/railgun-viewer",
    "crates/railgun-viewer-web",
]
resolver = "3"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[workspace.dependencies]
# Kohaku SDK (ethereum/kohaku-rs), branch zknox/dev of the ZKNOX fork. The keys keep the
# names the crates used in the kohaku monorepo, so the product code is unchanged.
# Cargo.lock pins the commit: `cargo update -p kohaku-railgun` moves to the branch head. To build
# against a local checkout instead, see "The Kohaku SDK" in README.md.
crypto = { package = "kohaku-crypto", git = "https://github.com/ZKNoxHQ/kohaku-rs", branch = "zknox/dev-pq" }
eip-1193-provider = { package = "kohaku-eip-1193", git = "https://github.com/ZKNoxHQ/kohaku-rs", branch = "zknox/dev-pq" }
kohaku-kv-store = { git = "https://github.com/ZKNoxHQ/kohaku-rs", branch = "zknox/dev-pq" }
railgun = { package = "kohaku-railgun", git = "https://github.com/ZKNoxHQ/kohaku-rs", branch = "zknox/dev-pq" }
userop-kit = { package = "kohaku-userop-kit", git = "https://github.com/ZKNoxHQ/kohaku-rs", branch = "zknox/dev-pq" }

# Product crates
kv-store-js = { path = "./crates/kv-store-js" }
railgun-chains = { path = "./crates/railgun-chains" }
railgun-ledger = { path = "./crates/railgun-ledger" }

aes-gcm = "0.10"
alloy = { version = "2.4.1", default-features = false }
anyhow = "1"
ark-bn254 = "0.6"
ark-ff = "0.6"
async-trait = "0.1.92"
cfg_aliases = "0.2.2"
console_error_panic_hook = "0.1"
curve25519-dalek = "4.1.3"
ed25519-dalek = "2.2.0"
futures = "0.3.31"
gloo-timers = "0.3.0"
hex = "0.4.3"
js-sys = "0.3"
num-bigint = "0.4.6"
rand = "0.10"
reqwest = { version = "0.13", default-features = false }
ruint = "1.20.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
thiserror = "2.0.20"
tokio = "1.53.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-wasm = "0.2"
wasm-bindgen = "=0.2.108"
wasm-bindgen-futures = "0.4"
web-time = "1.1"

[patch.crates-io]
# Same patch as kohaku-rs: opt-in parallel feature; without it wasm hangs indefinitely.
ark-circom = { git = "https://github.com/Robert-MacWha/circom-compat", branch = "release/0.6.0" }
