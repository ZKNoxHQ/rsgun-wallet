[package]
name = "railgun-viewer-web"
version = "0.1.7"
edition = "2024"
description = "Dr Rail as a static web page: the railgun-viewer session core compiled to wasm and run in a Web Worker"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# Everything is wasm-only: on a native workspace build this crate is an empty library.
[target.'cfg(target_arch = "wasm32")'.dependencies]
ark-bn254 = { workspace = true }
ark-ff = { workspace = true }
ruint = { workspace = true }
alloy = { workspace = true, default-features = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = "0.22"
bip32 = { version = "0.5", default-features = false, features = ["secp256k1", "std"] }
bip39 = { version = "2", default-features = false, features = ["std"] }
console_error_panic_hook = { workspace = true }
futures = { workspace = true }
gloo-timers = { workspace = true, features = ["futures"] }
hex = { workspace = true }
hmac = "0.12"
js-sys = { workspace = true }
kv-store-js = { workspace = true }
postcard = { workspace = true }
railgun = { workspace = true }
railgun-chains = { workspace = true }
railgun-broadcaster = { path = "../railgun-broadcaster", features = ["light-node"] }
rand = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
tracing-wasm = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-time = { workspace = true }
