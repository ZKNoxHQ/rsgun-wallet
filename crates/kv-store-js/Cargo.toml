[package]
name = "kv-store-js"
version = "0.1.0"
edition = "2024"
description = "Browser key-value storage (a JS database object, IndexedDB in the web wallets) for the wallets' persisted state"

[dependencies]
hex = { workspace = true }
js-sys = { workspace = true }
send_wrapper = { version = "0.6", features = ["futures"] }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }

[lints]
workspace = true
