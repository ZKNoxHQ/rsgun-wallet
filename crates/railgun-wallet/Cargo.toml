[package]
name = "railgun-wallet"
version = "0.13.0"
edition = "2024"
description = "ZKNOX local Railgun wallet (daemon + web front) built on the kohaku Rust SDK"
publish = false

[lib]
name = "railgun_wallet"
path = "src/lib.rs"

[[bin]]
name = "railgun-wallet"
path = "src/main.rs"
required-features = ["http"]

[features]
default = ["http", "native-waku"]
# axum server and the embedded front. Off on mobile: the app calls `ipc::dispatch` directly.
http = ["dep:axum"]
# Native Waku light node (rust-libp2p) for the legacy transport: Waku mode "native". Without it,
# "native" falls back to the node in the page ("browser").
native-waku = ["railgun-broadcaster/light-node"]

[dependencies]
alloy = { workspace = true, default-features = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"], optional = true }
base64 = "0.22"
bip32 = { version = "0.5", default-features = false, features = ["secp256k1", "std"] }
bip39 = { version = "2", default-features = false, features = ["std"] }
hex = { workspace = true }
hmac = "0.12"
postcard = { workspace = true }
railgun = { workspace = true }
railgun-chains = { workspace = true }
railgun-broadcaster = { path = "../railgun-broadcaster" }
railgun-ledger = { workspace = true, features = ["usb", "ble"] }
rand = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
userop-kit = { workspace = true }

