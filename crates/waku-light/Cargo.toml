[package]
name = "waku-light"
version = "0.4.1"
edition = "2024"
description = "Waku light client (filter v2 + light push v2/v3 + metadata) on rust-libp2p"
publish = false

[lib]
doctest = false

[dependencies]
futures = { workspace = true }
libp2p = { version = "0.57", default-features = false, features = [
    "noise", "yamux", "identify", "ping", "macros", "ed25519", "secp256k1",
] }
libp2p-mplex = "0.44"
libp2p-stream = "0.5.0-alpha"
prost = "0.14"
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "macros"] }
tracing = { workspace = true }
web-time = { workspace = true }

# Native: tokio executor and timers, TCP + DNS + rustls under libp2p's WebSocket transport.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["rt", "time"] }
libp2p = { version = "0.57", default-features = false, features = ["tokio", "dns", "tcp", "websocket"] }
hickory-resolver = { version = "0.26", default-features = false }
# Not used directly: enables TLS 1.2 in the rustls that libp2p-websocket builds with
# (`with_safe_default_protocol_versions` is TLS 1.3 only without it). nwaku serves wss through
# nim-websock / BearSSL, which has no TLS 1.3.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

# Browser: the page's own WebSocket (TLS and DNS done by the browser), browser event loop and
# timers, randomness from crypto.getRandomValues.
[target.'cfg(target_arch = "wasm32")'.dependencies]
libp2p = { version = "0.57", default-features = false, features = ["websocket-websys"] }
futures-timer = { version = "3", features = ["wasm-bindgen"] }
wasm-bindgen-futures = { workspace = true }
# Three getrandom generations in the graph (rand 0.8 in libp2p-identity, snow in noise, k256):
# each needs its JS backend. 0.3 also reads the `getrandom_backend="wasm_js"` cfg set in the
# workspace's .cargo/config.toml.
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { workspace = true, features = ["full"] }
tracing-subscriber = { workspace = true }

# Browser demo (examples/web_fleet.rs, examples/web/): wasm-bindgen glue, console logs and panics.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
console_error_panic_hook = { workspace = true }
tracing-wasm = { workspace = true }

[[example]]
name = "web_fleet"
crate-type = ["cdylib"]
